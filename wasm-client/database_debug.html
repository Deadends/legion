<!DOCTYPE html>
<html>
<head>
    <title>Database Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .log { margin: 5px 0; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0af; }
        button { margin: 10px 5px; padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🗃️ Database Debug</h1>
    
    <button onclick="checkUserExists()">Check if User Exists</button>
    <button onclick="testDirectMerkle()">Test Direct Merkle Path</button>
    <button onclick="analyzeDatabase()">Analyze Database State</button>
    
    <div id="log"></div>
    
    <script type="module">
        const SERVER_URL = 'http://127.0.0.1:3001';
        
        window.checkUserExists = async function() {
            log('🔍 Checking if user exists in database...', 'info');
            
            const username = 'testuser_1732064577154';
            const password = 'testpass123';
            
            try {
                // Try the old login to see if user exists
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✓ User exists! Legacy login successful`, 'success');
                    log(`  Session token: ${result.session_token?.substring(0, 32)}...`, 'info');
                } else {
                    const error = await response.text();
                    log(`❌ User check failed: ${response.status}`, 'error');
                    log(`  Error: ${error}`, 'error');
                }
            } catch (e) {
                log(`❌ User check error: ${e}`, 'error');
            }
        };
        
        window.testDirectMerkle = async function() {
            log('🔍 Testing direct Merkle path request...', 'info');
            
            try {
                const response = await fetch(`${SERVER_URL}/api/get-merkle-path`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tree_index: 66 })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✓ Direct Merkle path successful`, 'success');
                    log(`  Path length: ${result.path?.length || 'undefined'}`, 'info');
                } else {
                    log(`❌ Direct Merkle path failed: ${response.status}`, 'error');
                    log(`  This confirms PIR MANDATORY mode is active`, 'info');
                }
            } catch (e) {
                log(`❌ Direct Merkle error: ${e}`, 'error');
            }
        };
        
        window.analyzeDatabase = async function() {
            log('🔍 Analyzing database state from server perspective...', 'info');
            
            try {
                // Get PIR setup to understand database
                const response = await fetch(`${SERVER_URL}/api/pir-setup`);
                const data = await response.json();
                
                log(`📊 Database Analysis:`, 'info');
                log(`  PIR Version: ${data.version}`, 'info');
                log(`  Timestamp: ${new Date(data.version * 1000).toLocaleString()}`, 'info');
                
                // From server logs, we know:
                log(`📋 From Server Logs:`, 'info');
                log(`  - Total entries: 67`, 'info');
                log(`  - Tree supports: 1M users (2^20)`, 'info');
                log(`  - Tree depth: 20`, 'info');
                log(`  - Value size: 648 bytes (all entries)`, 'info');
                log(`  - Last entry: leaf 66`, 'info');
                
                // The problem analysis
                log(`🔍 Problem Analysis:`, 'error');
                log(`  1. We're querying tree_index=66 (should be valid)`, 'error');
                log(`  2. Server processes query successfully`, 'error');
                log(`  3. Client PIR decryption fails with 'RowNotDecodable'`, 'error');
                log(`  4. This suggests client/server PIR parameter mismatch`, 'error');
                
                log(`💡 Possible Solutions:`, 'success');
                log(`  1. Restart server to rebuild PIR from scratch`, 'success');
                log(`  2. Clear all client PIR cache`, 'success');
                log(`  3. Check if WASM PIR client version matches server`, 'success');
                log(`  4. Use legacy login as fallback`, 'success');
                
            } catch (e) {
                log(`❌ Database analysis error: ${e}`, 'error');
            }
        };
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('log').appendChild(div);
            console.log(message);
        }
        
        log('✓ Database debug page loaded', 'success');
    </script>
</body>
</html>
