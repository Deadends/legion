<!DOCTYPE html>
<html>
<head>
    <title>Quick Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .log { margin: 5px 0; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0af; }
        button { margin: 10px 5px; padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🚀 Quick Test</h1>
    
    <button onclick="testLegacyLogin()">Test Legacy Login</button>
    <button onclick="testPirVersion()">Check PIR Version</button>
    
    <div id="log"></div>
    
    <script>
        const SERVER_URL = 'http://127.0.0.1:3001';
        
        window.testLegacyLogin = async function() {
            log('🔐 Testing legacy login...', 'info');
            
            const username = 'testuser_1732064577154';
            const password = 'testpass123';
            
            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ Legacy login works!`, 'success');
                    log(`Session: ${result.session_token?.substring(0, 32)}...`, 'info');
                } else {
                    const error = await response.text();
                    log(`❌ Legacy login failed: ${response.status}`, 'error');
                    log(`Error: ${error}`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e}`, 'error');
            }
        };
        
        window.testPirVersion = async function() {
            log('🔍 Checking PIR version...', 'info');
            
            try {
                const response = await fetch(`${SERVER_URL}/api/pir-setup`);
                const data = await response.json();
                
                log(`Current PIR version: ${data.version}`, 'info');
                log(`Hint size: ${data.hint?.length || 0} bytes`, 'info');
                log(`Filter size: ${data.filter?.length || 0} bytes`, 'info');
                
                const cached = localStorage.getItem('legion_pir_version');
                if (cached) {
                    log(`Cached version: ${cached}`, 'info');
                    if (cached !== data.version.toString()) {
                        log(`⚠️ Version mismatch! Clearing cache...`, 'error');
                        localStorage.removeItem('legion_pir_version');
                        localStorage.removeItem('legion_pir_hint');
                        localStorage.removeItem('legion_pir_filter');
                        log(`✅ Cache cleared`, 'success');
                    }
                }
                
            } catch (e) {
                log(`❌ Error: ${e}`, 'error');
            }
        };
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('log').appendChild(div);
            console.log(message);
        }
        
        log('✅ Quick test loaded', 'success');
    </script>
</body>
</html>
