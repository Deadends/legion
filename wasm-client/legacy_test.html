<!DOCTYPE html>
<html>
<head>
    <title>Legacy Login Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .log { margin: 5px 0; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0af; }
        button { margin: 10px 5px; padding: 10px 20px; font-size: 16px; }
        input { margin: 5px; padding: 10px; background: #333; color: #fff; border: 1px solid #555; }
        pre { background: #333; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔐 Legacy Login Deep Test</h1>
    
    <div>
        <input type="text" id="username" placeholder="Username" value="testuser_1732064577154">
        <input type="password" id="password" placeholder="Password" value="testpass123">
        <button onclick="testLegacyLogin()">Test Legacy Login</button>
    </div>
    
    <div id="log"></div>
    
    <script>
        const SERVER_URL = 'http://127.0.0.1:3001';
        
        window.testLegacyLogin = async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log('🔐 Testing legacy login with full response analysis...', 'info');
            
            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                log(`Response status: ${response.status} ${response.statusText}`, 'info');
                log(`Response headers:`, 'info');
                for (const [key, value] of response.headers.entries()) {
                    log(`  ${key}: ${value}`, 'info');
                }
                
                if (response.ok) {
                    const responseText = await response.text();
                    log(`Raw response text:`, 'info');
                    log(`"${responseText}"`, 'info');
                    
                    try {
                        const result = JSON.parse(responseText);
                        log(`Parsed JSON:`, 'success');
                        log(`<pre>${JSON.stringify(result, null, 2)}</pre>`, 'success');
                        
                        // Check all possible token fields
                        const possibleTokens = [
                            'session_token',
                            'token', 
                            'access_token',
                            'sessionToken',
                            'auth_token',
                            'jwt',
                            'bearer'
                        ];
                        
                        log(`Checking for session tokens:`, 'info');
                        for (const field of possibleTokens) {
                            if (result[field]) {
                                log(`  ✓ Found ${field}: ${result[field].substring(0, 32)}...`, 'success');
                            } else {
                                log(`  ❌ No ${field}`, 'error');
                            }
                        }
                        
                        // Check if it's just a success message
                        if (result.success || result.message) {
                            log(`Success/Message response:`, 'info');
                            log(`  success: ${result.success}`, 'info');
                            log(`  message: ${result.message}`, 'info');
                        }
                        
                    } catch (parseError) {
                        log(`JSON parse error: ${parseError}`, 'error');
                        log(`Response might not be JSON`, 'error');
                    }
                    
                } else {
                    const errorText = await response.text();
                    log(`❌ Request failed: ${response.status}`, 'error');
                    log(`Error response: "${errorText}"`, 'error');
                }
                
            } catch (e) {
                log(`❌ Network error: ${e}`, 'error');
            }
        };
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            if (message.startsWith('<pre>')) {
                div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            } else {
                div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            }
            document.getElementById('log').appendChild(div);
            console.log(message);
        }
        
        log('✅ Legacy login test loaded', 'success');
    </script>
</body>
</html>
